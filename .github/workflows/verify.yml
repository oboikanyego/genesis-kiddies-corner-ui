name: UI verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:env
      - run: npm run test:scroll
      - run: npm run test:admin-mobile
      - run: npm run test:admin-login
      - run: npm run test:blocked-dates
      - run: npm run test:photos
      - run: npm run test:design
      - run: npm run test:format
      - run: npm run test:brand
      - run: npm run test:contact
      - run: npm run test:booking-guard
      - run: npm run typecheck
      - run: npm run build
        env:
          API_URL: https://example.invalid/api
